## IDF Component Manager manifest
dependencies:
  idf: ">=5.3.0"

  ## LVGL v9 via espressif managed components
  esp_lvgl_port:
    version: ">=2.3.0"
    rules:
      - if: "target == esp32p4"

  lvgl/lvgl:
    version: ">=9.1.0"
    rules:
      - if: "target == esp32p4"

  ## ESP-Hosted: P4 (SDIO master) ↔ C6 (SDIO slave) WiFi bridge
  ## C6 must be flashed with ESP-Hosted-MCU slave firmware (SDIO mode) at the
  ## SAME version as this host component — otherwise the RPC protocol mismatches
  ## and WiFi scans time out.  Use tools/flash_c6_slave.sh to build and flash.
  ## Pinned to 2.12.12 — bump this AND rebuild the C6 slave together.
  espressif/esp_hosted:
    version: "==2.12.12"
  espressif/esp_wifi_remote:
    version: ">=0.1.17"
