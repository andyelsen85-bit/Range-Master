name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  # Repository owner and name are derived automatically from github.repository
  IMAGE_API: ghcr.io/${{ github.repository }}/api-server
  IMAGE_PORTAL: ghcr.io/${{ github.repository }}/portal
  IMAGE_EMULATOR: ghcr.io/${{ github.repository }}/emulator

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Determine image tags ────────────────────────────────────────────────
      # On push to main:  <sha> + latest
      # On version tag:   <sha> + <tag> (e.g. v1.2.3)
      - name: Compute image tags — api-server
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Compute image tags — portal
        id: meta-portal
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PORTAL }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Compute image tags — emulator
        id: meta-emulator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_EMULATOR }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      # ── Build and push api-server ───────────────────────────────────────────
      - name: Build and push api-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api-server
          cache-to: type=gha,mode=max,scope=api-server

      # ── Build and push portal ───────────────────────────────────────────────
      - name: Build and push portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: ${{ steps.meta-portal.outputs.tags }}
          labels: ${{ steps.meta-portal.outputs.labels }}
          build-args: |
            BASE_PATH=/
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      # ── Build and push emulator ─────────────────────────────────────────────
      - name: Build and push emulator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.emulator
          push: true
          tags: ${{ steps.meta-emulator.outputs.tags }}
          labels: ${{ steps.meta-emulator.outputs.labels }}
          build-args: |
            BASE_PATH=/emulator/
          cache-from: type=gha,scope=emulator
          cache-to: type=gha,mode=max,scope=emulator
