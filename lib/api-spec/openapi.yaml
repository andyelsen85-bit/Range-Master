openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TrapMaster API — F.S.H.C.L. Sektioun Wolz
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: spieler
    description: Player management
  - name: rangliste
    description: Leaderboard
  - name: statistik
    description: Statistics
  - name: sync
    description: ESP32 display sync
  - name: admin
    description: Administrator operations

paths:
  /health:
    get:
      operationId: getPortalHealth
      tags: [Health]
      summary: Portal build identity and mounted sync contract
      responses:
        "200":
          description: Build metadata and mounted sync routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalHealth"
  /sync/terminal-logs:
    $ref: "./terminal-diagnostics.yaml#/paths/~1sync~1terminal-logs"
  /admin/terminal-logs:
    $ref: "./terminal-diagnostics.yaml#/paths/~1admin~1terminal-logs"
  /admin/terminal-logs/export:
    $ref: "./terminal-diagnostics.yaml#/paths/~1admin~1terminal-logs~1export"
  /sync/game-manifest:
    $ref: "./terminal-diagnostics.yaml#/paths/~1sync~1game-manifest"
  /admin/game-reconciliation:
    $ref: "./terminal-diagnostics.yaml#/paths/~1admin~1game-reconciliation"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpielerProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── SPIELER ───────────────────────────────────────────────────────────────
  /spieler:
    get:
      operationId: listSpieler
      tags: [spieler]
      summary: List all players
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: object
                properties:
                  spieler:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpielerProfile"
                required: [spieler]

  /spieler/{id}:
    get:
      operationId: getSpieler
      tags: [spieler]
      summary: Get player by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpielerProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /spieler/{id}/ergebnisse:
    get:
      operationId: getSpielerErgebnisse
      tags: [spieler]
      summary: Get player results
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ergebnisse:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErgebnisWithSpiel"
                required: [ergebnisse]
  /spieler/me/purchases:
    get:
      operationId: getMyPurchases
      tags: [spieler]
      summary: Get the authenticated player's event-level purchases and used game credits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Immutable purchase history scoped to the authenticated player
          content:
            application/json:
              schema:
                type: object
                required: [purchases]
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerPurchase"

  # ── RANGLISTE ─────────────────────────────────────────────────────────────
  /rangliste:
    get:
      operationId: getRangliste
      tags: [rangliste]
      summary: Get leaderboard
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 15, maximum: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [best, prozent, punkte, spiele], default: best } }
        - name: modus
          in: query
          schema:
            $ref: "#/components/schemas/Modus"
        - name: jahr
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  rangliste:
                    type: array
                    items:
                      $ref: "#/components/schemas/RanglisteEntry"
                  years: { type: array, items: { type: integer } }
                  ownRow: { anyOf: [{ $ref: "#/components/schemas/RanglisteEntry" }, { type: "null" }] }
                required: [rangliste]

  # ── STATISTIK ─────────────────────────────────────────────────────────────
  /statistik/{spielerId}:
    get:
      operationId: getStatistik
      tags: [statistik]
      summary: Get player statistics
      security:
        - bearerAuth: []
      parameters:
        - name: spielerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpielerStatistik"

  /statistik/{spielerId}/modus-breakdown:
    get:
      operationId: getStatistikModusBreakdown
      tags: [statistik]
      summary: Get per-format score breakdown for a player
      security:
        - bearerAuth: []
      parameters:
        - name: spielerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-format breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  breakdown:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModusBreakdownEntry"
                required: [breakdown]

  /statistik/{spielerId}/verlauf:
    get:
      operationId: getStatistikVerlauf
      tags: [statistik]
      summary: Get score history for sparkline charts
      security:
        - bearerAuth: []
      parameters:
        - name: spielerId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Score history
          content:
            application/json:
              schema:
                type: object
                properties:
                  verlauf:
                    type: array
                    items:
                      type: object
                      properties:
                        datum:
                          type: string
                          format: date
                        punkte:
                          type: integer
                        modus:
                          $ref: "#/components/schemas/Modus"
                        maxPunkte:
                          type: integer
                      required: [datum, punkte, modus, maxPunkte]
                required: [verlauf]

  # ── SYNC (ESP32 Display) ──────────────────────────────────────────────────
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Connectivity test for ESP32
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  spielerCount:
                    type: integer
                required: [status, timestamp, spielerCount]

  /sync/spieler:
    get:
      operationId: getSyncSpieler
      tags: [sync]
      summary: Get player list for ESP32
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: object
                properties:
                  spieler:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncSpieler"
                required: [spieler]
    post:
      operationId: postSyncSpieler
      tags: [sync]
      summary: Sync player list from ESP32
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spieler:
                  type: array
                  items:
                    $ref: "#/components/schemas/SyncSpieler"
              required: [spieler]
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: integer
                required: [synced]

  /sync/spiele:
    post:
      operationId: postSyncSpiele
      tags: [sync]
      summary: Upload game results from ESP32
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spiele:
                  type: array
                  items:
                    $ref: "#/components/schemas/SyncSpiel"
              required: [spiele]
      responses:
        "200":
          description: Sync results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        externalId:
                          type: string
                        status:
                          type: string
                          enum: [created, skipped, conflict, rejected]
                        error:
                          type: string
                        playerIds:
                          type: array
                          items:
                            type: integer
                      required: [externalId, status]
                required: [results]

  /sync/kredite/state:
    post:
      operationId: reconcileSyncDayCredits
      tags: [sync]
      summary: Read a consistent credit baseline with bounded event acknowledgements
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datum, pendingEventIds, useIds]
              properties:
                datum: { type: string, format: date }
                pendingEventIds: { type: array, maxItems: 100, items: { type: string, maxLength: 200 } }
                useIds: { type: array, maxItems: 106, items: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Single-snapshot totals and acknowledgements; countedUseIds are unsettled effective uses
          content:
            application/json:
              schema:
                type: object
                required: [datum, kredite, knownEventIds, voidedUseIds, countedUseIds]
                properties:
                  datum: { type: string, format: date }
                  kredite:
                    type: array
                    items:
                      type: object
                      required: [spielerId, gewaehrt, verbraucht]
                      properties:
                        spielerId: { type: integer }
                        gewaehrt: { type: integer }
                        verbraucht: { type: integer }
                  knownEventIds: { type: array, items: { type: string } }
                  voidedUseIds: { type: array, items: { type: string } }
                  countedUseIds: { type: array, items: { type: string } }
  /sync/kredite:
    get:
      operationId: getSyncDayCredits
      tags: [sync]
      summary: Get per-player credit balances for a day
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: datum, in: query, schema: { type: string, format: date } }]
      responses:
        "200": { description: Daily credit totals }
    post:
      operationId: postSyncCreditEvents
      tags: [sync]
      summary: Upload immutable game-credit grant and use events
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items: { $ref: "#/components/schemas/CreditEventInput" }
      responses:
        "200": { description: Idempotent upload result }
        "400": { description: Invalid credit event }
        "409": { description: Invalid credit balance or price snapshot }

  # ── ADMIN PLAYER RETENTION & RESET ───────────────────────────────────────
  /admin/spieler/{id}:
    delete:
      operationId: deactivateAdminPlayer
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Player deactivated while historical data remains intact
          content: { application/json: { schema: { $ref: "#/components/schemas/PlayerActivationResult" } } }
        "400": { description: Administrator accounts are protected, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/spieler/{id}/reactivate:
    post:
      operationId: reactivateAdminPlayer
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Player reactivated
          content: { application/json: { schema: { $ref: "#/components/schemas/PlayerActivationResult" } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/purge:
    post:
      operationId: purgeAdminData
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPurgeInput" } } }
      responses:
        "200":
          description: Operational data removed while catalogue and administrator accounts remain
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminPurgeResult" } } }
        "400": { description: Invalid scope or confirmation, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  # ── PRODUCTS & SALES ─────────────────────────────────────────────────────
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Product catalogue with current prices
          content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } }
    post:
      operationId: createAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FlexibleProductInput" } } }
      responses:
        "201":
          description: Product created
          content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } }
        "400": { description: Invalid product, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/products/{id}:
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductUpdate" } } }
      responses:
        "200": { description: Product updated, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Product deleted }
        "400": { description: Protected product, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/products/{id}/prices:
    post:
      operationId: createAdminProductPrice
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceRevisionInput" } } }
      responses:
        "201": { description: Immutable price revision created, content: { application/json: { schema: { $ref: "#/components/schemas/PriceRevision" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/products/{id}/current-price:
    get:
      operationId: getAdminCurrentProductPrice
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Current price, content: { application/json: { schema: { $ref: "#/components/schemas/PriceRevision" } } } }
        "404": { description: Product or current price not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/sales:
    get:
      operationId: getAdminDaySales
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: datum, in: query, schema: { type: string, format: date } }]
      responses:
        "200": { description: Per-day sales report, content: { application/json: { schema: { $ref: "#/components/schemas/DaySalesReport" } } } }
  /admin/kredite/legacy-cancel-candidates:
    get:
      operationId: getLegacyCreditCancellationCandidates
      tags: [admin]
      summary: Read-only heuristic review of legacy USE/GRANT compensation; never changes history
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: minutes, in: query, schema: { type: integer, minimum: 1, maximum: 1440, default: 30 } }
      responses:
        "200":
          description: Suspected legacy pairs, capped at 500; manual review required
          content:
            application/json:
              schema:
                type: object
                required: [candidates, minutes, limit]
                properties:
                  minutes: { type: integer }
                  limit: { type: integer }
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [spielerId, name, datum, useExternalId, grantExternalId, useAt, grantAt, anzahl]
                      properties:
                        spielerId: { type: integer }
                        name: { type: string }
                        datum: { type: string, format: date }
                        useExternalId: { type: string }
                        grantExternalId: { type: string }
                        useAt: { type: string, format: date-time }
                        grantAt: { type: string, format: date-time }
                        anzahl: { type: integer }
  /admin/kredite/adjust:
    post:
      operationId: adjustAdminCredit
      tags: [admin]
      summary: Append a one-credit grant or correction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminCreditAdjustmentInput" } } }
      responses:
        "200": { description: Adjustment accepted or idempotently skipped, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCreditAdjustmentResult" } } } }
        "400": { description: Invalid adjustment, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Negative balance or idempotency conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/ammo/adjust:
    post:
      operationId: adjustAdminAmmo
      tags: [admin]
      summary: Append a one-unit ammunition sale or reversal
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAmmoAdjustmentInput" } } }
      responses:
        "200": { description: Adjustment accepted or idempotently skipped, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAmmoAdjustmentResult" } } } }
        "400": { description: Invalid adjustment or non-ammunition product, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: "Negative quantity, missing price, or idempotency conflict", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /sync/products:
    get:
      operationId: getSyncProductCatalog
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      responses:
        "200": { description: Active catalogue, content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } } }
  /sync/sales:
    get:
      operationId: getSyncDaySales
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: datum, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        "200": { description: Day aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/DaySalesReport" } } } }
    post:
      operationId: postSyncSaleEvents
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SaleEventBatchInput" } } }
      responses:
        "200": { description: Idempotent upload result, content: { application/json: { schema: { $ref: "#/components/schemas/SaleSyncResult" } } } }
        "400": { description: "Unknown player, product, or price revision", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /sync/bills/day-summary:
    get:
      operationId: getSyncBillDaySummary
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: datum, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        "200": { description: Authoritative player bills and daily totals, content: { application/json: { schema: { $ref: "#/components/schemas/BillDaySummary" } } } }
  /sync/payments:
    post:
      operationId: postSyncBillPayments
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { $ref: "#/components/schemas/BillPaymentInput" } } } } } }
      responses:
        "200":
          description: Per-event accepted, skipped, or conflict result
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/BillPaymentResult" }
        "400": { description: Entire batch failed validation }
  /admin/bills/day-summary:
    get:
      operationId: getAdminBillDaySummary
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: datum, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        "200": { description: Authoritative bill day summary, content: { application/json: { schema: { $ref: "#/components/schemas/BillDaySummary" } } } }
  /admin/bills/activity-days:
    get:
      operationId: getAdminBillActivityDays
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: "Dates with synchronized billing, game, or payment activity", content: { application/json: { schema: { $ref: "#/components/schemas/BillActivityDays" } } } }
        "400": { description: Invalid or oversized date range, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/bills/period-summary:
    get:
      operationId: getAdminBillPeriodSummary
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Authoritative inclusive billing period summary, content: { application/json: { schema: { $ref: "#/components/schemas/BillPeriodSummary" } } } }
        "400": { description: Invalid or oversized date range, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/bills/{spielerId}/paid:
    post:
      operationId: markAdminBillPaid
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: spielerId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [datum], properties: { datum: { type: string, format: date }, externalId: { type: string } } } } }
      responses:
        "200": { description: Payment accepted or idempotently skipped }
        "409": { description: External payment identifier conflicts }

# ── COMPONENTS ────────────────────────────────────────────────────────────
  /sync/inventory/state:
