        "200": { description: Updated group, content: { application/json: { schema: { $ref: "#/components/schemas/PortalData" } } } }
    delete:
      operationId: deleteKioskGroup
      security: [{ KioskDevice: [] }]
      responses:
        "200": { description: Soft deleted group, content: { application/json: { schema: { $ref: "#/components/schemas/PortalData" } } } }
  /public/groups/{id}/signup:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      operationId: kioskGroupSignup
