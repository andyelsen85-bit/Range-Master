openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TrapMaster API — F.S.H.C.L. Sektioun Wolz
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: spieler
    description: Player management
  - name: rangliste
    description: Leaderboard
  - name: statistik
    description: Statistics
  - name: sync
    description: ESP32 display sync
  - name: admin
    description: Administrator operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpielerProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── SPIELER ───────────────────────────────────────────────────────────────
  /spieler:
    get:
      operationId: listSpieler
      tags: [spieler]
      summary: List all players
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: object
                properties:
                  spieler:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpielerProfile"
                required: [spieler]

  /spieler/{id}:
    get:
      operationId: getSpieler
      tags: [spieler]
      summary: Get player by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpielerProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /spieler/{id}/ergebnisse:
    get:
      operationId: getSpielerErgebnisse
      tags: [spieler]
      summary: Get player results
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ergebnisse:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErgebnisWithSpiel"
                required: [ergebnisse]
  /spieler/me/purchases:
    get:
      operationId: getMyPurchases
      tags: [spieler]
      summary: Get the authenticated player's event-level purchases and used game credits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Immutable purchase history scoped to the authenticated player
          content:
            application/json:
              schema:
                type: object
                required: [purchases]
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerPurchase"

  # ── RANGLISTE ─────────────────────────────────────────────────────────────
  /rangliste:
    get:
      operationId: getRangliste
      tags: [rangliste]
      summary: Get leaderboard
      parameters:
        - name: modus
          in: query
          schema:
            $ref: "#/components/schemas/Modus"
        - name: jahr
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  rangliste:
                    type: array
                    items:
                      $ref: "#/components/schemas/RanglisteEntry"
                required: [rangliste]

  # ── STATISTIK ─────────────────────────────────────────────────────────────
  /statistik/{spielerId}:
    get:
      operationId: getStatistik
      tags: [statistik]
      summary: Get player statistics
      security:
        - bearerAuth: []
      parameters:
        - name: spielerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpielerStatistik"

  /statistik/{spielerId}/modus-breakdown:
    get:
      operationId: getStatistikModusBreakdown
      tags: [statistik]
      summary: Get per-format score breakdown for a player
      security:
        - bearerAuth: []
      parameters:
        - name: spielerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-format breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  breakdown:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModusBreakdownEntry"
                required: [breakdown]

  /statistik/{spielerId}/verlauf:
    get:
      operationId: getStatistikVerlauf
      tags: [statistik]
      summary: Get score history for sparkline charts
      security:
        - bearerAuth: []
      parameters:
        - name: spielerId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Score history
          content:
            application/json:
              schema:
                type: object
                properties:
                  verlauf:
                    type: array
                    items:
                      type: object
                      properties:
                        datum:
                          type: string
                          format: date
                        punkte:
                          type: integer
                        modus:
                          $ref: "#/components/schemas/Modus"
                        maxPunkte:
                          type: integer
                      required: [datum, punkte, modus, maxPunkte]
                required: [verlauf]

  # ── SYNC (ESP32 Display) ──────────────────────────────────────────────────
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Connectivity test for ESP32
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  spielerCount:
                    type: integer
                required: [status, timestamp, spielerCount]

  /sync/spieler:
    get:
      operationId: getSyncSpieler
      tags: [sync]
      summary: Get player list for ESP32
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: object
                properties:
                  spieler:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncSpieler"
                required: [spieler]
    post:
      operationId: postSyncSpieler
      tags: [sync]
      summary: Sync player list from ESP32
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spieler:
                  type: array
                  items:
                    $ref: "#/components/schemas/SyncSpieler"
              required: [spieler]
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: integer
                required: [synced]

  /sync/spiele:
    post:
      operationId: postSyncSpiele
      tags: [sync]
      summary: Upload game results from ESP32
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spiele:
                  type: array
                  items:
                    $ref: "#/components/schemas/SyncSpiel"
              required: [spiele]
      responses:
        "200":
          description: Sync results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        externalId:
                          type: string
                        status:
                          type: string
                          enum: [created, skipped]
                      required: [externalId, status]
                required: [results]

  /sync/kredite:
    get:
      operationId: getSyncDayCredits
      tags: [sync]
      summary: Get per-player credit balances for a day
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: datum, in: query, schema: { type: string, format: date } }]
      responses:
        "200": { description: Daily credit totals }
    post:
      operationId: postSyncCreditEvents
      tags: [sync]
      summary: Upload immutable game-credit grant and use events
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items: { $ref: "#/components/schemas/CreditEventInput" }
      responses:
        "200": { description: Idempotent upload result }
        "400": { description: Invalid credit event }
        "409": { description: Invalid credit balance or price snapshot }

  # ── ADMIN PLAYER RETENTION & RESET ───────────────────────────────────────
  /admin/spieler/{id}:
    delete:
      operationId: deactivateAdminPlayer
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Player deactivated while historical data remains intact
          content: { application/json: { schema: { $ref: "#/components/schemas/PlayerActivationResult" } } }
        "400": { description: Administrator accounts are protected, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/spieler/{id}/reactivate:
    post:
      operationId: reactivateAdminPlayer
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Player reactivated
          content: { application/json: { schema: { $ref: "#/components/schemas/PlayerActivationResult" } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/purge:
    post:
      operationId: purgeAdminData
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPurgeInput" } } }
      responses:
        "200":
          description: Operational data removed while catalogue and administrator accounts remain
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminPurgeResult" } } }
        "400": { description: Invalid scope or confirmation, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  # ── PRODUCTS & SALES ─────────────────────────────────────────────────────
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Product catalogue with current prices
          content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } }
    post:
      operationId: createAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FlexibleProductInput" } } }
      responses:
        "201":
          description: Product created
          content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } }
        "400": { description: Invalid product, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/products/{id}:
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductUpdate" } } }
      responses:
        "200": { description: Product updated, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Product deleted }
        "400": { description: Protected product, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/products/{id}/prices:
    post:
      operationId: createAdminProductPrice
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceRevisionInput" } } }
      responses:
        "201": { description: Immutable price revision created, content: { application/json: { schema: { $ref: "#/components/schemas/PriceRevision" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/products/{id}/current-price:
    get:
      operationId: getAdminCurrentProductPrice
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Current price, content: { application/json: { schema: { $ref: "#/components/schemas/PriceRevision" } } } }
        "404": { description: Product or current price not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/sales:
    get:
      operationId: getAdminDaySales
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: datum, in: query, schema: { type: string, format: date } }]
      responses:
        "200": { description: Per-day sales report, content: { application/json: { schema: { $ref: "#/components/schemas/DaySalesReport" } } } }
  /admin/kredite/adjust:
    post:
      operationId: adjustAdminCredit
      tags: [admin]
      summary: Append a one-credit grant or correction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminCreditAdjustmentInput" } } }
      responses:
        "200": { description: Adjustment accepted or idempotently skipped, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCreditAdjustmentResult" } } } }
        "400": { description: Invalid adjustment, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Negative balance or idempotency conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/ammo/adjust:
    post:
      operationId: adjustAdminAmmo
      tags: [admin]
      summary: Append a one-unit ammunition sale or reversal
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAmmoAdjustmentInput" } } }
      responses:
        "200": { description: Adjustment accepted or idempotently skipped, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAmmoAdjustmentResult" } } } }
        "400": { description: Invalid adjustment or non-ammunition product, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Player not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: "Negative quantity, missing price, or idempotency conflict", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /sync/products:
    get:
      operationId: getSyncProductCatalog
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      responses:
        "200": { description: Active catalogue, content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } } }
  /sync/sales:
    get:
      operationId: getSyncDaySales
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: datum, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        "200": { description: Day aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/DaySalesReport" } } } }
    post:
      operationId: postSyncSaleEvents
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SaleEventBatchInput" } } }
      responses:
        "200": { description: Idempotent upload result, content: { application/json: { schema: { $ref: "#/components/schemas/SaleSyncResult" } } } }
        "400": { description: "Unknown player, product, or price revision", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /sync/bills/day-summary:
    get:
      operationId: getSyncBillDaySummary
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ name: datum, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        "200": { description: Authoritative player bills and daily totals, content: { application/json: { schema: { $ref: "#/components/schemas/BillDaySummary" } } } }
  /sync/payments:
    post:
      operationId: postSyncBillPayments
      tags: [sync]
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { $ref: "#/components/schemas/BillPaymentInput" } } } } } }
      responses:
        "200":
          description: Per-event accepted, skipped, or conflict result
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/BillPaymentResult" }
        "400": { description: Entire batch failed validation }
  /admin/bills/day-summary:
    get:
      operationId: getAdminBillDaySummary
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: datum, in: query, required: true, schema: { type: string, format: date } }]
      responses:
        "200": { description: Authoritative bill day summary, content: { application/json: { schema: { $ref: "#/components/schemas/BillDaySummary" } } } }
  /admin/bills/activity-days:
    get:
      operationId: getAdminBillActivityDays
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: "Dates with synchronized billing, game, or payment activity", content: { application/json: { schema: { $ref: "#/components/schemas/BillActivityDays" } } } }
        "400": { description: Invalid or oversized date range, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/bills/period-summary:
    get:
      operationId: getAdminBillPeriodSummary
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Authoritative inclusive billing period summary, content: { application/json: { schema: { $ref: "#/components/schemas/BillPeriodSummary" } } } }
        "400": { description: Invalid or oversized date range, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/bills/{spielerId}/paid:
    post:
      operationId: markAdminBillPaid
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: spielerId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [datum], properties: { datum: { type: string, format: date }, externalId: { type: string } } } } }
      responses:
        "200": { description: Payment accepted or idempotently skipped }
        "409": { description: External payment identifier conflicts }

# ── COMPONENTS ────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    ProductCategory:
      type: string
      enum: [GAME_CREDIT, AMMO_CAL12, AMMO_CAL20, FOOD, DRINK]
    Product:
      type: object
      required: [id, name, category, isSystem, active]
      properties:
        id: { type: integer }
        code: { type: [string, "null"] }
        name: { type: string }
        category: { $ref: "#/components/schemas/ProductCategory" }
        isSystem: { type: boolean }
        active: { type: boolean }
        currentPrice: { anyOf: [{ $ref: "#/components/schemas/PriceRevision" }, { type: "null" }] }
    ProductList:
      type: object
      required: [products]
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/Product" } }
    FlexibleProductInput:
      type: object
      required: [name, category, unitPriceCents]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, enum: [FOOD, DRINK] }
        active: { type: boolean, default: true }
        unitPriceCents: { type: integer, minimum: 0 }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, enum: [FOOD, DRINK] }
        active: { type: boolean }
    PriceRevisionInput:
      type: object
      required: [unitPriceCents]
      properties:
        unitPriceCents: { type: integer, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
    PriceRevision:
      type: object
      required: [id, productId, unitPriceCents, effectiveFrom]
      properties:
        id: { type: integer }
        productId: { type: integer }
        unitPriceCents: { type: integer }
        effectiveFrom: { type: string, format: date-time }
    SaleEventInput:
      type: object
      required: [externalId, spielerId, datum, productId, quantity]
      properties:
        externalId: { type: string, minLength: 1 }
        spielerId: { type: integer, minimum: 1 }
        datum: { type: string, format: date }
        productId: { type: integer, minimum: 1 }
        priceRevisionId:
          description: Required for positive sales. Omit, null, or use legacy 0 for a negative correction; the server allocates its original immutable sale lot.
          type: [integer, "null"]
          minimum: 0
        quantity: { type: integer, minimum: -1, not: { const: 0 } }
    SaleEventBatchInput:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/SaleEventInput" } }
    SaleSyncResult:
      type: object
      required: [synced, skipped]
      properties:
        synced: { type: integer }
        skipped: { type: integer }
    AdminCreditAdjustmentInput:
      type: object
      required: [spielerId, datum, delta, externalId]
      properties:
        spielerId: { type: integer, minimum: 1 }
        datum: { type: string, format: date }
        delta: { type: integer, enum: [-1, 1] }
        externalId: { type: string, minLength: 1, maxLength: 200 }
    AdminAmmoAdjustmentInput:
      allOf:
        - $ref: "#/components/schemas/AdminCreditAdjustmentInput"
        - type: object
          required: [productId]
          properties:
            productId: { type: integer, minimum: 1 }
    AdminCreditAdjustmentResult:
      type: object
      required: [externalId, status, credit]
      properties:
        externalId: { type: string }
        status: { type: string, enum: [accepted, skipped] }
        credit:
          type: object
          required: [spielerId, datum, gewaehrt, verbraucht, available]
          properties:
            spielerId: { type: integer }
            datum: { type: string, format: date }
            gewaehrt: { type: integer }
            verbraucht: { type: integer }
            available: { type: integer }
    AdminAmmoAdjustmentResult:
      type: object
      required: [externalId, status, ammo]
      properties:
        externalId: { type: string }
        status: { type: string, enum: [accepted, skipped] }
        ammo:
          type: object
          required: [spielerId, datum, productId, quantity]
          properties:
            spielerId: { type: integer }
            datum: { type: string, format: date }
            productId: { type: integer }
            quantity: { type: integer }
    BillPaymentInput:
      type: object
      required: [externalId, spielerId, datum]
      properties:
        externalId: { type: string }
        spielerId: { type: integer }
        datum: { type: string, format: date }
        terminalId: { type: string }
    CreditEventInput:
      type: object
      required: [externalId, spielerId, datum, typ, anzahl]
      properties:
        externalId: { type: string, minLength: 8 }
        spielerId: { type: integer, minimum: 1 }
        datum: { type: string, format: date }
        typ: { type: string, enum: [GRANT, USE] }
        anzahl: { type: integer, minimum: -100, maximum: 100, not: { const: 0 } }
        occurredAt:
          type: string
          format: date-time
          description: Required for USE events; immutable terminal occurrence time.
        priceRevisionId:
          type: integer
          minimum: 1
          description: Required for USE events; must belong to GAME_CREDIT.
        unitPriceCents:
          type: integer
          minimum: 0
          description: Required for USE events; must match priceRevisionId.
    BillPaymentResult:
      type: object
      required: [externalId, status]
      properties:
        externalId: { type: string }
        status: { type: string, enum: [accepted, skipped, conflict] }
        error: { type: string }
    PlayerPurchase:
      type: object
      required: [type, id, externalId, datum, createdAt, productId, productName, category, priceRevisionId, unitPriceCents, quantity, totalCents]
      properties:
        type: { type: string, enum: [SALE, GAME_CREDIT_USE] }
        id: { type: integer }
        externalId: { type: string }
        datum: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        productId: { type: integer }
        productName: { type: string }
        category: { $ref: "#/components/schemas/ProductCategory" }
        priceRevisionId: { type: integer }
        unitPriceCents: { type: integer }
        quantity: { type: integer }
        totalCents: { type: integer }
    BillDaySummary:
      type: object
      required: [datum, players, categorySubtotals, productTotals, generalTotalCents, uniquePlayers, paidPlayers, games, completedGames, theoreticalClays, confirmedClays, unconfirmedClays, gameBreakdown]
      properties:
        datum: { type: string, format: date }
        players: { type: array, items: { type: object } }
        categorySubtotals: { type: object, additionalProperties: { type: integer } }
        productTotals:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BillProductTotal"
        generalTotalCents: { type: integer }
        uniquePlayers: { type: integer }
        paidPlayers: { type: integer }
        games: { type: integer }
        completedGames: { type: integer }
        theoreticalClays: { type: integer }
        confirmedClays: { type: integer }
        unconfirmedClays: { type: integer }
        gameBreakdown:
          type: array
          items: { $ref: "#/components/schemas/BillGameBreakdown" }
    BillActivityDays:
      type: object
      required: [from, to, days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { type: string, format: date }
    BillPeriodSummary:
      type: object
      required: [from, to, players, categorySubtotals, productTotals, generalTotalCents, uniquePlayers, paidPlayers, games, completedGames, theoreticalClays, confirmedClays, unconfirmedClays, gameBreakdown]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        players:
          type: array
          items: { $ref: "#/components/schemas/BillPeriodPlayer" }
        categorySubtotals: { type: object, additionalProperties: { type: integer } }
        productTotals:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BillProductTotal"
        generalTotalCents: { type: integer }
        uniquePlayers: { type: integer }
        paidPlayers: { type: integer }
        games: { type: integer }
        completedGames: { type: integer }
        theoreticalClays: { type: integer }
        confirmedClays: { type: integer }
        unconfirmedClays: { type: integer }
        gameBreakdown:
          type: array
          items: { $ref: "#/components/schemas/BillGameBreakdown" }
    BillGameBreakdown:
      type: object
      required: [modus, games, completedGames, playerParticipations, theoreticalClays, confirmedClays, unconfirmedClays]
      properties:
        modus: { $ref: "#/components/schemas/Modus" }
        games: { type: integer }
        completedGames: { type: integer }
        playerParticipations: { type: integer }
        theoreticalClays: { type: integer }
        confirmedClays: { type: integer }
        unconfirmedClays: { type: integer }
    BillPeriodPlayer:
      type: object
      required: [spielerId, spielerName, mitgliedNr, lines, categorySubtotals, totalCents, openTotalCents, credit, games, completedGames, paidDays, state]
      properties:
        spielerId: { type: integer }
        spielerName: { type: string }
        mitgliedNr: { type: [string, "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BillProductTotal" }
        categorySubtotals: { type: object, additionalProperties: { type: integer } }
        totalCents: { type: integer }
        openTotalCents: { type: integer }
        credit:
          type: object
          required: [granted, used, remaining]
          properties:
            granted: { type: integer }
            used: { type: integer }
            remaining: { type: integer }
        games: { type: integer }
        completedGames: { type: integer }
        paidDays: { type: integer }
        state: { type: string, enum: [OPEN, PENDING_NEUTRAL, PAID] }
    BillProductTotal:
      type: object
      required: [productId, productName, category, priceRevisionId, unitPriceCents, quantity, totalCents]
      properties:
        productId: { type: integer }
        productName: { type: string }
        category: { $ref: "#/components/schemas/ProductCategory" }
        priceRevisionId: { type: integer }
        unitPriceCents: { type: integer }
        quantity: { type: integer }
        totalCents: { type: integer }
    DaySalesItem:
      type: object
      required: [spielerId, productId, quantity, totalCents]
      properties:
        spielerId: { type: integer }
        spielerName: { type: string }
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        totalCents: { type: integer }
    DaySalesReport:
      type: object
      required: [datum, sales, totalCents]
      properties:
        datum: { type: string, format: date }
        sales: { type: array, items: { $ref: "#/components/schemas/DaySalesItem" } }
        totalCents: { type: integer }
    PlayerActivationResult:
      type: object
      required: [aktiv]
      properties:
        id: { type: integer }
        aktiv: { type: boolean }
        deactivated: { type: boolean }
    AdminPurgeInput:
      oneOf:
        - type: object
          required: [mode, datum, confirmation]
          properties:
            mode: { type: string, enum: [day] }
            datum: { type: string, format: date }
            confirmation: { type: string, enum: [PURGE_DAY] }
        - type: object
          required: [mode, confirmation]
          properties:
            mode: { type: string, enum: [all] }
            confirmation: { type: string, enum: [PURGE_ALL] }
    AdminPurgeCounts:
      type: object
      required: [players, games, participations, results, credits, sales, billPayments, playerUpdates]
      properties:
        players: { type: integer }
        games: { type: integer }
        participations: { type: integer }
        results: { type: integer }
        credits: { type: integer }
        sales: { type: integer }
        billPayments: { type: integer }
        playerUpdates: { type: integer }
    AdminPurgeResult:
      type: object
      required: [mode, counts]
      properties:
        mode: { type: string, enum: [day, all] }
        datum: { type: string, format: date }
        counts: { $ref: "#/components/schemas/AdminPurgeCounts" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Modus:
      type: string
      enum:
        - NORMAL
        - HARAKIRI
        - HARAKIRI_DELAYED
        - HARAKIRI_FULL
        - CUSTOM_1
        - CUSTOM_2
        - CUSTOM_3
        - CUSTOM_4

    Maschine:
      type: string
      enum: [A, B, C, D, E, F, G, H]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        passwort:
          type: string
          minLength: 6
      required: [email, passwort]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        spieler:
          $ref: "#/components/schemas/SpielerProfile"
      required: [token, spieler]

    SpielerProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        mitgliedNr:
          type: string
          nullable: true
        aktiv:
          type: boolean
        portalAktiv:
          type: boolean
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, aktiv, portalAktiv, isAdmin, createdAt]

    ErgebnisWithSpiel:
      type: object
      properties:
        id:
          type: integer
        spielId:
          type: integer
        lauf:
          type: integer
        taube:
          type: integer
        maschine:
          $ref: "#/components/schemas/Maschine"
        posten:
          type: integer
        schuss1:
          type: boolean
        schuss2:
          type: boolean
        punkte:
          type: integer
        wiederholt:
          type: boolean
        spiel:
          type: object
          properties:
            datum:
              type: string
              format: date-time
            modus:
              $ref: "#/components/schemas/Modus"
          required: [datum, modus]
      required: [id, spielId, lauf, taube, maschine, posten, schuss1, schuss2, punkte, wiederholt, spiel]

    RanglisteEntry:
      type: object
      properties:
        rang:
          type: integer
        spielerId:
          type: integer
        name:
          type: string
        gesamtPunkte:
          type: integer
        anzahlSpiele:
          type: integer
        durchschnitt:
          type: number
        durchschnittProzent:
          type: number
          description: >
            Normalized average as a percentage of the maximum possible score
            (gesamtPunkte / gesamtMaxPunkte × 100). Use this for cross-format
            comparisons because different game formats have different max scores.
        bestPunkte:
          type: integer
      required: [rang, spielerId, name, gesamtPunkte, anzahlSpiele, durchschnitt, durchschnittProzent, bestPunkte]

    ModusBreakdownEntry:
      type: object
      properties:
        modus:
          $ref: "#/components/schemas/Modus"
        anzahlSpiele:
          type: integer
        durchschnitt:
          type: number
          description: Raw average points per game
        durchschnittProzent:
          type: number
          description: Normalized average as % of max possible score (same method as leaderboard)
      required: [modus, anzahlSpiele, durchschnitt, durchschnittProzent]

    SpielerStatistik:
      type: object
      properties:
        spielerId:
          type: integer
        gesamtSpiele:
          type: integer
        durchschnitt:
          type: number
        bestPunkte:
          type: integer
        trefferquote:
          type: number
        maschinen:
          type: object
          additionalProperties:
            type: object
            properties:
              versuche:
                type: integer
              treffer:
                type: integer
              quote:
                type: number
            required: [versuche, treffer, quote]
      required: [spielerId, gesamtSpiele, durchschnitt, bestPunkte, trefferquote, maschinen]

    SyncSpieler:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        mitgliedNr:
          type: string
          nullable: true
      required: [id, name]

    SyncSpiel:
      type: object
      properties:
        externalId:
          type: string
          format: uuid
        datum:
          type: string
          format: date-time
        modus:
          $ref: "#/components/schemas/Modus"
        lauf:
          type: integer
          minimum: 1
          maximum: 2
        abgeschlossen:
          type: boolean
        confirmedLaunches:
          type: integer
          minimum: 0
        teilnahmen:
          type: array
          items:
            $ref: "#/components/schemas/SyncTeilnahme"
        ergebnisse:
          type: array
          items:
            $ref: "#/components/schemas/SyncErgebnis"
      required: [externalId, datum, modus, lauf, abgeschlossen, teilnahmen, ergebnisse]

    SyncTeilnahme:
      type: object
      properties:
        spielerId:
          type: integer
        startPosten:
          type: integer
          minimum: 1
          maximum: 6
        punkte:
          type: integer
          minimum: 0
          maximum: 36
        lauf:
          type: integer
          minimum: 1
          maximum: 2
      required: [spielerId, startPosten, punkte, lauf]

    SyncErgebnis:
      type: object
      properties:
        spielerId:
          type: integer
        lauf:
          type: integer
          minimum: 1
          maximum: 2
        taube:
          type: integer
          minimum: 1
          maximum: 9
        maschine:
          $ref: "#/components/schemas/Maschine"
        posten:
          type: integer
          minimum: 1
          maximum: 6
        schuss1:
          type: boolean
        schuss2:
          type: boolean
        punkte:
          type: integer
          minimum: 0
          maximum: 4
        wiederholt:
          type: boolean
      required: [spielerId, lauf, taube, maschine, posten, schuss1, schuss2, punkte, wiederholt]
