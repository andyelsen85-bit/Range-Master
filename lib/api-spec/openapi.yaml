      responses:
        "200": { description: Entire group signed up, content: { application/json: { schema: { $ref: "#/components/schemas/PortalData" } } } }
  /public/player/{id}/days:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
