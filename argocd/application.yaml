apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trapmaster
  namespace: argocd
spec:
  project: default

  source:
    # Replace OWNER/REPO with your actual GitHub repository path
    repoURL: https://github.com/OWNER/REPO.git
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: trapmaster

  syncPolicy:
    automated:
      prune: true      # remove resources no longer in Git
      selfHeal: true   # revert out-of-band cluster changes
    syncOptions:
      - CreateNamespace=true
