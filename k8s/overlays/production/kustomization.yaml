apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trapmaster

resources:
  - ../../base

# Image tag substitution — ArgoCD Image Updater rewrites these automatically
# when a new image is pushed to the registry.
images:
  - name: ghcr.io/OWNER/REPO/api-server
    newName: ghcr.io/OWNER/REPO/api-server
    newTag: latest
  - name: ghcr.io/OWNER/REPO/portal
    newName: ghcr.io/OWNER/REPO/portal
    newTag: latest
