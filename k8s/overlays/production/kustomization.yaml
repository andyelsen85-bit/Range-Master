apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rangemaster

resources:
  - ../../base
  - ingress.yaml

# Image tag substitution — ArgoCD Image Updater rewrites these automatically
# when a new image is pushed to the registry.
images:
  - name: ghcr.io/andyelsen85-bit/range-master/api-server
    newName: ghcr.io/andyelsen85-bit/range-master/api-server
    newTag: latest
  - name: ghcr.io/andyelsen85-bit/range-master/portal
    newName: ghcr.io/andyelsen85-bit/range-master/portal
    newTag: latest
  - name: ghcr.io/andyelsen85-bit/range-master/emulator
    newName: ghcr.io/andyelsen85-bit/range-master/emulator
    newTag: latest
