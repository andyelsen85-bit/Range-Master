apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trapmaster

resources:
  - ../../base
  - ingress.yaml

# ArgoCD Image Updater reads these annotations and updates the image tags
# automatically when new images are pushed to ghcr.io.
# See: https://argocd-image-updater.readthedocs.io/
images:
  - name: ghcr.io/OWNER/REPO/api-server
    newTag: latest
  - name: ghcr.io/OWNER/REPO/portal
    newTag: latest
