apiVersion: v1
kind: Secret
metadata:
  name: trapmaster-secrets
  namespace: trapmaster
type: Opaque
stringData:
  database-url: "postgres://USER:PASSWORD@HOST:5432/trapmaster"
  jwt-secret: "REPLACE_WITH_64_CHAR_RANDOM_HEX"
  session-secret: "REPLACE_WITH_64_CHAR_RANDOM_HEX"
