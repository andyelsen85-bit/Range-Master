# secrets.example.yaml — DO NOT COMMIT WITH REAL VALUES
#
# Two secrets must be created before the first ArgoCD sync.
#
# ── 1. Postgres credentials (used by the in-cluster PostgreSQL StatefulSet) ───
#
#   kubectl create secret generic postgres-secret \
#     --namespace rangemaster \
#     --from-literal=POSTGRES_DB='trapmaster' \
#     --from-literal=POSTGRES_USER='trapmaster' \
#     --from-literal=POSTGRES_PASSWORD='<strong-random-password>'
#
# ── 2. API server runtime secrets ─────────────────────────────────────────────
#
#   The DATABASE_URL now points at the in-cluster Postgres Service.
#   Replace <password> with the same value used in postgres-secret above.
#
#   kubectl create secret generic api-server-secrets \
#     --namespace rangemaster \
#     --from-literal=DATABASE_URL='postgres://trapmaster:<password>@postgres.rangemaster.svc.cluster.local:5432/trapmaster' \
#     --from-literal=JWT_SECRET='<random-256-bit-hex>' \
#     --from-literal=SESSION_SECRET='<random-256-bit-hex>'
#
# Or use Sealed Secrets / External Secrets Operator — adapt accordingly.
# Neither secret is managed by Kustomize so ArgoCD will never overwrite them.
#
# ── 3. Run database migrations (once, after first deploy) ─────────────────────
#
#   kubectl exec -n rangemaster deploy/api-server -- \
#     node --input-type=module --eval \
#     "import { migrate } from '/app/node_modules/drizzle-orm/migrator'; \
#      import { db } from '/app/lib/db/index.mjs'; \
#      await migrate(db, { migrationsFolder: '/app/lib/db/migrations' });"
#
#   Or run the migration script bundled with the image (see Dockerfile).
#
# --- templates ---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: rangemaster
type: Opaque
stringData:
  POSTGRES_DB: "trapmaster"
  POSTGRES_USER: "trapmaster"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-server-secrets
  namespace: rangemaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://trapmaster:REPLACE_WITH_STRONG_PASSWORD@postgres.rangemaster.svc.cluster.local:5432/trapmaster"
  JWT_SECRET: "REPLACE_WITH_RANDOM_256_BIT_SECRET"
  SESSION_SECRET: "REPLACE_WITH_RANDOM_256_BIT_SECRET"
