# secrets.example.yaml — DO NOT COMMIT WITH REAL VALUES
#
# This file documents the Secret that must be created in the cluster before
# ArgoCD syncs the first time. Create it with:
#
#   kubectl create secret generic api-server-secrets \
#     --namespace trapmaster \
#     --from-literal=DATABASE_URL='postgres://user:password@host:5432/dbname' \
#     --from-literal=JWT_SECRET='<random-256-bit-hex>' \
#     --from-literal=SESSION_SECRET='<random-256-bit-hex>'
#
# Or, if you use Sealed Secrets / External Secrets Operator, adapt accordingly.
# The Secret is not managed by Kustomize so it is never overwritten by ArgoCD.
#
# --- template (base64-encode real values before pasting) ---
apiVersion: v1
kind: Secret
metadata:
  name: api-server-secrets
  namespace: trapmaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require"
  JWT_SECRET: "REPLACE_WITH_RANDOM_256_BIT_SECRET"
  SESSION_SECRET: "REPLACE_WITH_RANDOM_256_BIT_SECRET"
