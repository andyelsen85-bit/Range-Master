# ──────────────────────────────────────────────────────────────────────────────
# Two Ingress resources share the same host.  nginx-ingress merges all paths
# into one server block and sorts regex locations by descending specificity
# (longer pattern wins).  Both resources use ImplementationSpecific + regex so
# the controller applies per-resource rewrite-target correctly:
#
#   rangemaster-api       /api(/|$)(.*)       rewrite → /api/$2   (keeps prefix)
#   rangemaster-frontend  /emulator(/|$)(.*)  rewrite → /$2       (strips prefix)
#                         /()(.*)             rewrite → /$2       (portal catch-all)
# ──────────────────────────────────────────────────────────────────────────────

# ── 1. API backend — regex match, rewrite preserves /api prefix ───────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rangemaster-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: rangemaster.hostzone.lu
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-server
                port:
                  number: 8080
---
# ── 2. SPA frontends — regex paths, rewrite strips path prefix ────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rangemaster-frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: rangemaster.hostzone.lu
      http:
        paths:
          # /emulator/* → emulator nginx (built with base /emulator/)
          - path: /emulator(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: emulator
                port:
                  number: 80
          # /* → portal nginx (built with BASE_PATH=/)
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: portal
                port:
                  number: 80
