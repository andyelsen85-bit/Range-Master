# ──────────────────────────────────────────────────────────────────────────────
# Two Ingress resources are required because nginx-ingress applies
# rewrite-target per-resource, not per-path.
#
#  rangemaster-api      /api/*       →  api-server:8080  (NO rewrite — the
#                                       Express app is mounted at /api)
#  rangemaster-frontend /emulator/*  →  emulator:80      (strips /emulator prefix)
#                       /*           →  portal:80         (no strip; BASE_PATH=/)
# ──────────────────────────────────────────────────────────────────────────────

# ── 1. API backend — prefix match, no path rewrite ────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rangemaster-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: rangemaster.hostzone.lu
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-server
                port:
                  number: 8080
---
# ── 2. SPA frontends — regex paths with prefix-stripping rewrite ──────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rangemaster-frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: rangemaster.hostzone.lu
      http:
        paths:
          # /emulator/* → emulator nginx (built with base /emulator/, rewrite strips it)
          - path: /emulator(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: emulator
                port:
                  number: 80
          # /* → portal nginx (built with BASE_PATH=/, no effective strip needed)
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: portal
                port:
                  number: 80
