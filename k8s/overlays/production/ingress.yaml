# ──────────────────────────────────────────────────────────────────────────────
# Single Ingress resource.  All paths share rewrite-target: /$2 which strips
# the path prefix before forwarding to the backend:
#
#   /api(/|$)(.*)       → api-server:8080  (Express mounted at /, receives /auth/login etc.)
#   /emulator(/|$)(.*)  → emulator:80      (nginx built with base /emulator/)
#   /()(.*)             → portal:80        (nginx built with BASE_PATH=/)
#
# Using a single resource guarantees nginx-ingress orders the locations by
# path length (most specific first) within one compiled server block.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rangemaster
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: rangemaster.hostzone.lu
      http:
        paths:
          # API — Express router mounted at /; rewrite strips /api prefix
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-server
                port:
                  number: 8080
          # Emulator SPA — nginx built with base /emulator/; rewrite strips prefix
          - path: /emulator(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: emulator
                port:
                  number: 80
          # Portal SPA — catch-all; built with BASE_PATH=/; no effective strip
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: portal
                port:
                  number: 80
